	"""
	When the change happened.
	"""
	timestamp: DateTime!
	"""
	What changed.
	"""
	kind: AlarmEventKind!
	"""
	Deployment that owns the alarm.
	"""
	origin: String!
	"""
	Alarm name. Empty on a `GAP` row.
	"""
	name: String!
	"""
	Alarm area. Empty on a `GAP` row.
	"""
	area: String!
	"""
	Subcondition identity. Empty on a `GAP` row.
	"""
	condition: String!
	"""
	Alarm instance. Nil on a `GAP` row.
	"""
	instanceId: UUID!
	"""
	State of the instance. Absent on a `GAP` row.
	"""
	state: AlarmState
	"""
	Value of the associated measurement. Absent on a `GAP` row.
	"""
	value: Float
	"""
	Alarm severity. Absent on a `GAP` row.
	"""
	severity: AlarmSeverity
	"""
	Acknowledge status at that moment.
	"""
	ack: AlarmAckStatus!
	"""
	When the instance was acknowledged, if it was by then.
	"""
	ackedAt: DateTime
	"""
	JWT `sub` of the user who acknowledged, if any.
	"""
	ackedById: String
	"""
	Display name of the user who acknowledged, if any.
	"""
	ackedBy: String
