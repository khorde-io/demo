"""
Result of `ackAlarm`.
"""
type AckAlarmResult {
	"""
	What happened.
	"""
	status: AckAlarmStatus!
	"""
	The instance after the ack. Absent when `NOT_FOUND`.
	"""
	alarm: ActiveAlarm
}

"""
Outcome of `ackAlarm`.
"""
enum AckAlarmStatus {
	"""
	The owner recorded this ack.
	"""
	ACKED
	"""
	The instance was already acknowledged. The first ack stands.
	"""
	ALREADY_ACKED
	"""
	Queued for an owner site, which applies it when it can be reached.
	"""
	PENDING
	"""
	No such active instance: it left the summary or never existed.
	"""
	NOT_FOUND
}

"""
An alarm instance in the summary: currently `Set`, or returned to normal
and not acknowledged yet.
"""
type ActiveAlarm {
	"""
	Identifies the subcondition. Pass it to `ackAlarm`.
	"""
	key: ID!
	"""
	Deployment that owns the alarm: a site, or this hub.
	"""
	origin: String!
	"""
	Alarm name.
	"""
	name: String!
	"""
	Alarm area.
	"""
	area: String!
	"""
	Subcondition identity.
	"""
	condition: String!
	"""
	Identity of this occurrence.
	"""
	instanceId: UUID!
	"""
	Alarm state.
	"""
	state: AlarmState!
	"""
	Alarm severity.
	"""
	severity: AlarmSeverity!
	"""
	Measurement value at the last state change.
	"""
	value: Float!
	"""
	When this occurrence started.
	"""
	setAt: DateTime!
	"""
	When the state last changed.
	"""
	stateAt: DateTime!
	"""
	Acknowledge status.
	"""
	ack: AlarmAckStatus!
	"""
	When it was acknowledged, if it was.
	"""
	ackedAt: DateTime
	"""
	Who acknowledged it, if anyone.
	"""
	ackedBy: String
	"""
	Whether the owner is reachable. When false, this is its last known
	state.
	"""
	originOnline: Boolean!
}

"""
One change of the active alarm summary.
"""
type ActiveAlarmChange {
	"""
	What changed.
	"""
	kind: ActiveAlarmChangeKind!
	"""
	Instance concerned. Absent on `SYNCED`.
	"""
	instanceId: UUID
	"""
	The instance after the change. Only on `UPSERT`.
	"""
	alarm: ActiveAlarm
}

"""
What an [`ActiveAlarmChange`] says.
"""
enum ActiveAlarmChangeKind {
	"""
	The instance is new or changed. `alarm` holds it.
	"""
	UPSERT
	"""
	The instance left the summary.
	"""
	REMOVE
	"""
	Every alarm active when the subscription started has been sent.
	"""
	SYNCED
}

"""
Agent liveness derived from the last heartbeat.
"""
enum AgentConnectivity {
	online
	offline
	unknown
}

"""
Last recorded agent heartbeat and derived connectivity.
"""
type AgentHeartbeat {
	"""
	Agent name (config / Zitadel username).
	"""
	agent: String!
	"""
	When the last heartbeat was received.
	"""
	lastSeenAt: String
	"""
	Derived connectivity status.
	"""
	status: AgentConnectivity!
}

"""
Acknowledge status of an alarm instance.
"""
enum AlarmAckStatus {
	"""
	Not acknowledged.
	"""
	NOT_ACK
	"""
	Acknowledged by the alarm's owner.
	"""
	ACK
	"""
	Acknowledged on the hub and on its way to an owner site.
	"""
	ACK_PENDING
}

"""
What one alarm journal row records.
"""
enum AlarmEventKind {
	"""
	The alarm became active.
	"""
	SET
	"""
	The alarm returned to normal.
	"""
	RESET
	"""
	An edge-only event occurred.
	"""
	EVENT
	"""
	An operator acknowledged the instance.
	"""
	ACK
	"""
	Events were lost: the source retention expired during an outage.
	"""
	GAP
}

input AlarmFilter {
	timestamp: TimestampFilter!
}

