# Serves the built HMI. The file names under /assets/ change with their content,
# so they can be cached for good; everything else must be asked for again.

map $uri $cache_control {
    default       "no-cache";
    ~^/assets/    "public, max-age=31536000, immutable";
    /config.json  "no-store";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # For the cluster's probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Routes are in the URL's hash, so there are no paths to fall back from.
    location / {
        try_files $uri $uri/ =404;
    }
}
