# Runtime settings for the vds-substation REST agent (mounted at /opt/agent/config.yaml).
# Its points come from site-config/vds-agents.yaml, uploaded to the hub.
rest:
  host: 0.0.0.0
  port: 9090
  # Commands from the hub are forwarded to the simulator.
  webhook: "http://simulator:8091/webhook"
agent:
  broker:
    ip: host.docker.internal
    port: "4223" # host port of the demo hub (hub/docker-compose.yaml)
    tls: false
  credentials:
    url: http://auth.localhost:9311
    project_id: khorde_scada
    # Mounted from keys/vds-substation.json by docker-compose.yaml.
    service_account_path: service-user.json
  command_timeout: 10s
