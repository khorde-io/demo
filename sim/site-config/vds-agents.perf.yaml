          - vds.sub.hv.tr2.cb::pos
          - 0
    - key: sub_mv_b_tr2_cb_remote
      description: TR2 incomer breaker is in remote control
      expression:
        eq:
          - vds.sub.mv.b.tr2.cb::remote_local
          - 1
    - key: sub_mv_b_tr2_cb_close
      description: Close the TR2 incomer only in remote with TR2 energized from 138 kV
      expression:
        and:
          - ref: sub_mv_b_tr2_cb_remote
          - eq:
              - vds.sub.hv.tr2.cb::pos
              - 1
    - key: sub_mv_b_tr2_ds_operate
      description: Operate tr2 incomer disconnector only with its breaker open
      expression:
        eq:
          - vds.sub.mv.b.tr2.cb::pos
          - 0
    - key: sub_mv_bc_cb_remote
      description: Bus coupler breaker is in remote control
      expression:
        eq:
          - vds.sub.mv.bc.cb::remote_local
          - 1
    - key: sub_mv_bc_cb_close
      description: Close the bus coupler only with both disconnectors closed and one incomer open (no transformer paralleling)
      expression:
        and:
          - ref: sub_mv_bc_cb_remote
          - eq:
              - vds.sub.mv.bc.ds_a::pos
              - 1
          - eq:
              - vds.sub.mv.bc.ds_b::pos
              - 1
          - or:
              - eq:
                  - vds.sub.mv.a.tr1.cb::pos
                  - 0
              - eq:
                  - vds.sub.mv.b.tr2.cb::pos
                  - 0
    - key: sub_mv_bc_ds_a_operate
      description: Operate bus coupler disconnector a only with its breaker open
      expression:
        eq:
          - vds.sub.mv.bc.cb::pos
          - 0
    - key: sub_mv_bc_ds_b_operate
