  interlocks:
    - key: sub_hv_l1_cb_remote
      description: L1 circuit breaker is in remote control
      expression:
        eq:
          - vds.sub.hv.l1.cb::remote_local
          - 1
    - key: sub_hv_l1_cb_close
      description: Close the L1 breaker only in remote with the line earthing switch open
      expression:
        and:
          - ref: sub_hv_l1_cb_remote
          - eq:
              - vds.sub.hv.l1.es::pos
              - 0
    - key: sub_hv_l1_ds_operate
      description: Operate l1 line disconnector only with its breaker open
      expression:
        eq:
          - vds.sub.hv.l1.cb::pos
          - 0
    - key: sub_hv_l1_es_close
      description: Close l1 line earthing switch only when the circuit is isolated and dead
      expression:
        and:
          - eq:
              - vds.sub.hv.l1.cb::pos
              - 0
          - eq:
              - vds.sub.hv.l1.ds::pos
              - 0
          - lt:
              - vds.sub.hv.l1::v_kv
              - 1
    - key: sub_tr1_tap_raise
      description: TR1 is below its top tap
      expression:
        lt:
          - vds.sub.tr1::tap
          - 17
    - key: sub_tr1_tap_lower
      description: TR1 is above its bottom tap
      expression:
        gt:
          - vds.sub.tr1::tap
          - 1
    - key: sub_hv_tr1_cb_remote
      description: TR1 138 kV breaker is in remote control
      expression:
        eq:
          - vds.sub.hv.tr1.cb::remote_local
          - 1
    - key: sub_hv_tr1_cb_close
      description: Close the TR1 138 kV breaker only in remote
      expression:
        ref: sub_hv_tr1_cb_remote
    - key: sub_hv_tr1_ds_operate
      description: Operate tr1 138 kv disconnector only with its breaker open
      expression:
        eq:
          - vds.sub.hv.tr1.cb::pos
          - 0
    - key: sub_mv_a_tr1_cb_remote
      description: TR1 incomer breaker is in remote control
      expression:
        eq:
          - vds.sub.mv.a.tr1.cb::remote_local
          - 1
    - key: sub_mv_a_tr1_cb_close
      description: Close the TR1 incomer only in remote with TR1 energized from 138 kV
      expression:
        and:
          - ref: sub_mv_a_tr1_cb_remote
          - eq:
              - vds.sub.hv.tr1.cb::pos
              - 1
    - key: sub_mv_a_tr1_ds_operate
      description: Operate tr1 incomer disconnector only with its breaker open
      expression:
        eq:
          - vds.sub.mv.a.tr1.cb::pos
          - 0
    - key: sub_tr2_tap_raise
      description: TR2 is below its top tap
      expression:
        lt:
          - vds.sub.tr2::tap
          - 17
    - key: sub_tr2_tap_lower
      description: TR2 is above its bottom tap
      expression:
        gt:
          - vds.sub.tr2::tap
          - 1
    - key: sub_hv_tr2_cb_remote
      description: TR2 138 kV breaker is in remote control
      expression:
        eq:
          - vds.sub.hv.tr2.cb::remote_local
          - 1
    - key: sub_hv_tr2_cb_close
      description: Close the TR2 138 kV breaker only in remote
      expression:
        ref: sub_hv_tr2_cb_remote
